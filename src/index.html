<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Organizer</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body.sand{--desk:#ebe4db;--cover:#c9b39b;--cover-edge:#b39a80;--paper:#fffdfa;--line:#efe5dc;--line2:#dccdbf;--fill:#f4ebe3;--ink:#3a2f29;--muted:#9a8676;--accent:#9c7a63;--hi:#faf3ec;--dot:#d3c3b5}
body.nordic{--desk:#eceef0;--cover:#3b4148;--cover-edge:#2c3136;--paper:#fcfcfc;--line:#eceef1;--line2:#d5d9de;--fill:#f0f2f4;--ink:#1f2328;--muted:#7b848d;--accent:#2f5d8a;--hi:#f4f7fa;--dot:#cfd4d9}
body.classic{--desk:#e6dfd2;--cover:#5c3a21;--cover-edge:#472c18;--paper:#f8f2e1;--line:#e8dcbf;--line2:#d2c09a;--fill:#efe4c8;--ink:#3a2c1a;--muted:#8a7350;--accent:#993C1D;--hi:#f4ead0;--dot:#cdbb94}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--desk);color:var(--ink);font-size:14px;display:flex;flex-direction:column;min-width:1020px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
.bar{display:flex;align-items:center;gap:14px;padding:10px 24px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;position:relative;z-index:30}
.brand{font-weight:800;color:var(--ink);letter-spacing:.24em;font-size:12px}
.sp{flex:1}
.bbtn{padding:6px 11px;border:1px solid var(--line2);border-radius:4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink);background:transparent;font-family:inherit}
.bbtn:hover{background:var(--paper)}
.menubar{display:flex;gap:2px}
.mb{position:relative}
.mb>button{padding:5px 9px;border-radius:4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink)}
.mb>button:hover,.mb.open>button{background:var(--paper)}
.dd{display:none;position:absolute;top:100%;left:0;min-width:250px;background:var(--paper);border:1px solid var(--line2);border-radius:6px;padding:5px;box-shadow:0 8px 28px rgba(0,0,0,.14);text-transform:none;letter-spacing:0}
.mb.open>.dd{display:block}
.msub{position:relative}
.msub>.dd{top:-6px;left:100%}
.msub:hover>.dd{display:block}
.mi{display:flex;justify-content:space-between;gap:28px;width:100%;padding:6px 10px;border-radius:4px;font-size:13px;font-weight:500;color:var(--ink);text-align:left;white-space:nowrap}
.mi:hover{background:var(--hi)}
.mi .k{color:var(--muted);font-size:11.5px}
.msep{height:1px;background:var(--line);margin:4px 6px}
.wrap{flex:1;min-height:0;padding:0 24px 24px;display:flex}
.cover{flex:1;min-height:640px;background:var(--cover);border-radius:14px;padding:16px 8px;display:flex;border:1px solid var(--cover-edge)}
.tabs{display:flex;flex-direction:column;gap:4px;padding:22px 0}
.tabs.l{align-items:flex-end}
.tab{writing-mode:vertical-rl;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:width .12s}
.tabs.r .tab{border-radius:0 6px 6px 0;flex:1;max-height:100px;min-height:60px;width:30px}
.secrow{display:flex;align-items:center;justify-content:space-between;padding-top:3px;padding-bottom:3px}
.seg{display:flex;gap:2px}
.seg button{font-size:10px;font-weight:800;letter-spacing:.08em;padding:3px 7px;border-radius:3px;color:var(--muted)}
.seg button:hover{background:var(--paper)}
.seg button.on{background:var(--accent);color:var(--paper)}
.slot.minor .h{font-weight:500;font-size:10.5px;color:var(--line2)}
.slot.minor{border-bottom-style:dashed}
.slot.s30{height:28px}.slot.s15{height:25px}
.slot.s30 input.ln,.slot.s15 input.ln{height:24px}
.me{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;border:1px solid var(--line2);border-radius:20px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink)}
.me:hover{background:var(--paper)}
.me .av{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--paper);display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.04em}
.chip{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--fill);color:var(--muted)}
.chip.active{background:var(--accent);color:var(--paper)}
.chip.hold{border:1px dashed var(--muted);background:transparent}
.chip.done{text-decoration:line-through}
.pbar{height:4px;background:var(--fill);border-radius:2px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--accent)}
.ci .ctop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pfilter{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 6px}
.pfilter button{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:3px;color:var(--muted);border:1px solid var(--line2)}
.pfilter button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.person{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:4px 0}
.person .pav{width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--muted);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.person .pn{width:38%;min-width:0;flex:none}
.person .pn button{font-weight:700;color:var(--ink);text-align:left}
.person .pn button:hover{color:var(--accent)}
.person .pn div{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person:hover .x{opacity:1}
select.pick,select.asg,select.ln{font:inherit;color:inherit;background:transparent;border:1px solid var(--line2);border-radius:4px;padding:6px 8px;outline:none}
select.pick{margin-top:6px;color:var(--muted);font-size:12.5px;max-width:100%}
.ptask input.due{width:132px;flex:none;font-size:12.5px;color:var(--muted)}
.ptask select.asg{width:130px;flex:none;font-size:12px;padding:3px 4px;border-color:transparent;color:var(--muted)}
.ptask select.asg:hover{border-color:var(--line2)}
.ev.dl,.lnk.dl{color:#a3392b;font-weight:600}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.pgrid .fld input,.pgrid .fld select{font:inherit;color:inherit;background:transparent;border:1px solid var(--line2);border-radius:4px;padding:7px 9px;width:100%}
.pgrid .full{grid-column:1/3}
.pgrid textarea{height:60px;font-family:inherit;font-size:13px}
.err{color:#a3392b;font-size:12.5px;min-height:1em}
.dtw{display:flex;align-items:center;flex:1;min-width:0}
.dtw input.dt{flex:1;min-width:0}
.dtb{color:var(--muted);padding:0 6px;display:flex;align-items:center;height:28px;border-radius:3px}
.dtb:hover{color:var(--accent);background:var(--hi)}
.ptask .dtw.due{flex:none;width:136px}
.ptask .dtw.due input{font-size:12.5px;color:var(--muted)}
.pgrid .fld .dtw{border:1px solid var(--line2);border-radius:4px}
.pgrid .fld .dtw input.dt{border:none;padding:7px 9px;height:auto}
.mbox>.dtw{border:1px solid var(--line2);border-radius:4px}
.mbox>.dtw input.dt{border:none;padding:8px 10px;height:auto}
#dp{position:fixed;z-index:60;background:var(--paper);border:1px solid var(--line2);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:10px;width:256px;display:none;color:var(--ink)}
#dp.open{display:block}
#dp .dph{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
#dp .dph button{width:28px;height:28px;border-radius:4px;font-size:16px}
#dp .dph button:hover{background:var(--hi)}
#dp .dpg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12.5px}
#dp .dpg .w{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;padding:3px 0}
#dp .dpg button{padding:6px 0;border-radius:4px}
#dp .dpg button:hover{background:var(--hi)}
#dp .dpg button.out{color:var(--line2)}
#dp .dpg button.td{box-shadow:inset 0 0 0 1px var(--accent)}
#dp .dpg button.sel{background:var(--accent);color:var(--paper)}
#dp .dpf{display:flex;justify-content:space-between;margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
#dp .dpf button{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);padding:4px 6px;border-radius:3px}
#dp .dpf button:hover{background:var(--hi)}
.tabs.r .tab.on{width:38px}
.tabs.l .tab{transform:rotate(180deg);border-radius:0 6px 6px 0;flex:1;max-height:64px;width:26px;font-size:10px}
.tabs.l .tab.on{width:34px}
.tab:focus-visible{outline:2px solid var(--ink)}
.page{flex:1;min-width:0;background:var(--paper);padding:26px 32px;overflow:auto;display:flex;flex-direction:column;position:relative;z-index:1}
.page.left{border-radius:6px 0 0 6px}
.page.right{border-radius:0 6px 6px 0}
.spine{width:26px;background:var(--cover-edge);display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;position:relative;z-index:2}
.ring{width:50px;height:11px;border-radius:6px;background:#dcdcdc;border:1px solid #9c9c9c;flex:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:5px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1.1}
.pnav{display:flex;gap:6px;flex:none}
.nb{min-width:30px;height:30px;border:1px solid var(--line2);border-radius:4px;font-size:16px;display:flex;align-items:center;justify-content:center}
.nb.t{padding:0 11px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.nb:hover,.add:hover{background:var(--hi)}
.danger{color:#a3392b}
.sec{background:var(--fill);font-size:10.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-radius:3px;margin:16px 0 4px;flex:none}
.ph+.sec{margin-top:0}
input.ln,textarea{font:inherit;color:inherit;background:transparent;border:none;outline:none;width:100%}
input.ln{border-bottom:1px solid var(--line);padding:6px 4px;height:32px}
input.ln::placeholder,textarea::placeholder{color:var(--line2)}
input.ln:focus,textarea:focus{background:var(--hi)}
textarea{resize:none;padding:6px 8px;border:1px solid var(--line);border-radius:3px;line-height:1.6;flex:none}
.row{display:flex;align-items:center;gap:8px}
.num{width:18px;color:var(--muted);font-size:12px;font-weight:700;flex:none}
.slot{display:flex;border-bottom:1px solid var(--line);height:31px;align-items:center;flex:none}
.slot .h{width:50px;font-size:11.5px;font-weight:700;color:var(--muted);border-right:1px solid var(--line2);height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:9px;flex:none}
.slot input.ln{border:none;height:30px;padding-left:10px}
.slot.now .h{color:var(--accent)}
.todo{display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);padding-left:2px}
.todo input.ln{border:none}
.todo.done input.ln{text-decoration:line-through;color:var(--muted)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:15px;height:15px;border:1.5px solid var(--line2);border-radius:50%;margin:0;flex:none;cursor:pointer}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--paper)}
.x{opacity:0;color:var(--muted);font-size:17px;padding:0 6px;line-height:1}
.todo:hover .x,.fr:hover .x,.hab:hover .x{opacity:1}
.add{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:7px 6px;border-radius:3px;margin-top:2px;align-self:flex-start}
.lnk{color:var(--accent);font-weight:600;padding:7px 2px}
.mu{color:var(--muted);font-size:12.5px}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line2);border-left:1px solid var(--line2);flex:1;min-height:420px}
.dh{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center;padding:6px 0;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);background:var(--fill)}
.mc{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:5px 6px;cursor:pointer;overflow:hidden;font-size:11.5px;min-width:0}
.mc:hover{background:var(--hi)}
.mc.out{color:var(--line2);background:transparent}
.mc .d{font-weight:700;font-size:12px;display:inline-block;padding:0 4px;border-radius:3px;margin-left:-4px}
.mc.today .d{background:var(--accent);color:var(--paper)}
.ev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ev.b{color:var(--accent);font-weight:600}
.ev .tm{color:var(--muted);font-weight:700;font-size:11px;margin-right:4px}
.yg{display:grid;grid-template-columns:1fr 1fr;gap:22px 28px}
.mini .mt{font-size:10.5px;font-weight:800;letter-spacing:.18em;margin-bottom:6px;cursor:pointer;padding:6px 10px;background:var(--fill);border-radius:3px;color:var(--muted);text-transform:uppercase}
.mini .mt:hover{color:var(--ink)}
.mini .g{display:grid;grid-template-columns:repeat(7,1fr);font-size:11.5px;text-align:center;row-gap:2px}
.mini .g span{padding:4px 0;border-radius:3px;position:relative}
.mini .g .wdh{color:var(--muted);font-weight:800;font-size:10px;text-transform:uppercase}
.mini .g span[data-act]{cursor:pointer}
.mini .g span[data-act]:hover{background:var(--hi)}
.mini .g .has::after{content:'';position:absolute;bottom:1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.mini .g .today{background:var(--accent);color:var(--paper);font-weight:700}
.mini .g .today::after{background:var(--paper)}
.wks{display:flex;flex-direction:column;flex:1;border-top:1px solid var(--line2)}
.wk{display:flex;border-bottom:1px solid var(--line2);min-height:64px;flex:1 0 auto;cursor:pointer}
.wk:hover{background:var(--hi)}
.wk .dl{width:60px;flex:none;border-right:1px solid var(--line2);padding:7px 0 0 2px}
.wk .dl b{display:block;font-size:10.5px;letter-spacing:.18em;font-weight:800;color:var(--muted);text-transform:uppercase}
.wk .dl span{font-size:22px;font-weight:300}
.wk.today .dl b,.wk.today .dl span{color:var(--accent);font-weight:700}
.wk .de{flex:1;padding:7px 12px;font-size:12.5px;min-width:0}
.wk .ev:first-child{margin-top:0}
.hhead{display:flex;justify-content:flex-end;gap:6px;font-size:10px;color:var(--muted);font-weight:800;padding-right:29px;margin-top:4px;text-transform:uppercase}
.hhead span{width:15px;text-align:center}
.hab{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.hab input.ln{border:none;flex:1}
.hd{display:flex;gap:6px}
.search{border:1px solid var(--line2);border-radius:4px;padding:9px 11px;width:100%;font:inherit;background:transparent;outline:none;color:inherit}
.search:focus{border-color:var(--accent)}
.az{display:flex;flex-wrap:wrap;gap:2px;margin:10px 0 4px}
.az button{width:24px;height:24px;font-size:11px;font-weight:800;border-radius:3px;color:var(--ink)}
.az button:hover{background:var(--hi)}
.az button.on{background:var(--accent);color:var(--paper)}
.az button.dim{color:var(--line2)}
.lt{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.18em;margin:14px 0 2px;border-bottom:1px solid var(--line2);padding:0 0 4px 2px}
.ci{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:3px}
.ci:hover{background:var(--hi)}
.ci.on{background:var(--fill)}
.ci .n{font-weight:700}
.ci .s{font-size:12px;color:var(--muted);margin-top:1px}
.fr{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.fr .lbl{width:104px;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);flex:none;padding-left:2px}
.fr input.ln{border:none}
.fr input.lab{width:104px;flex:none;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fr a{color:var(--accent);font-size:10.5px;font-weight:800;letter-spacing:.14em;text-decoration:none;text-transform:uppercase;flex:none}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--muted);letter-spacing:.06em;flex:none}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:14px;text-align:center}
.empty h1{color:var(--line2)}
.tplg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 4px}
.tpb{border:1px solid var(--line2);border-radius:4px;padding:7px;text-align:center;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tpb:hover{background:var(--hi);color:var(--ink)}
.pv{height:58px;margin-bottom:7px;border-radius:2px;border:1px solid var(--line)}
.pv-lined{background:repeating-linear-gradient(var(--paper) 0 7px,var(--line2) 7px 8px)}
.pv-dot{background:radial-gradient(var(--dot) 1px,transparent 1.4px) 0 0/8px 8px}
.pv-grid{background:linear-gradient(var(--line2) 1px,transparent 1px) 0 0/8px 8px,linear-gradient(90deg,var(--line2) 1px,transparent 1px) 0 0/8px 8px}
.pv-check{background:radial-gradient(circle at 6px 5px,transparent 2px,var(--line2) 2.4px,var(--line2) 3.2px,transparent 3.6px) 0 0/100% 10px,repeating-linear-gradient(var(--paper) 0 9px,var(--line) 9px 10px)}
.pv-cornell{background:linear-gradient(var(--line2),var(--line2)) 30% 0/1px 70% no-repeat,linear-gradient(var(--line2),var(--line2)) 0 70%/100% 1px no-repeat}
textarea.body{flex:1;min-height:420px;border:none;border-radius:0;padding:0 6px;background-attachment:local}
.t-lined{background:repeating-linear-gradient(to bottom,transparent 0 27px,var(--line2) 27px 28px);line-height:28px}
.t-dot{background:radial-gradient(var(--dot) 1.1px,transparent 1.7px) 0 0/22px 22px;line-height:22px}
.t-grid{background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/22px 22px;line-height:22px}
.t-blank{line-height:1.7}
input.title{font:inherit;font-size:22px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border:none;border-bottom:2px solid var(--ink);padding:4px 2px;width:100%;background:transparent;outline:none;color:inherit}
input.title::placeholder{color:var(--line2)}
.cornell{display:grid;grid-template-columns:30% 1fr;grid-template-rows:1fr auto;flex:1;border:1px solid var(--line2);min-height:440px}
.cornell textarea,.cornell .pta{border:none;border-radius:0;height:100%;background:repeating-linear-gradient(to bottom,transparent 0 27px,var(--line) 27px 28px);background-attachment:local;line-height:28px}
.cornell .cue{border-right:1px solid var(--line2)}
.cornell .sum{grid-column:1/3;border-top:1px solid var(--line2);min-height:100px}
.modal{position:fixed;inset:0;background:rgba(20,15,10,.35);display:flex;align-items:center;justify-content:center;z-index:40}
.modal.hidden{display:none}
.mbox{background:var(--paper);border-radius:8px;padding:26px;width:min(600px,92vw);display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.mbox h2{margin:0;font-size:16px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.mbox textarea{height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.5}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.fld>.fl{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.radios{display:flex;flex-direction:column;gap:6px}
.radios label{display:flex;gap:8px;align-items:center;cursor:pointer}
.mbox select,.mbox input[type=number],.mbox input[type=date]{font:inherit;color:inherit;background:transparent;border:1px solid var(--line2);border-radius:4px;padding:7px 9px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.bbtn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sct{width:100%;border-collapse:collapse;font-size:13px}
.sct td{padding:6px 4px;border-bottom:1px solid var(--line)}
.sct td:first-child{font-weight:700;white-space:nowrap;width:42%;color:var(--accent)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:4px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
#print{display:none}
#print.measure{display:block;position:absolute;left:-99999px;top:0}
.sheet{display:flex;gap:10mm;overflow:hidden;break-after:page;page-break-after:always}
.sheet:last-child{break-after:auto;page-break-after:auto}
.ppage{flex:1;min-width:0;overflow:hidden;background:#fff;position:relative}
.pin{display:flex;flex-direction:column;min-height:100%;font-size:12px;transform-origin:0 0}
#print .page{padding:0;overflow:visible;border-radius:0;background:#fff}
#print .add,#print .x,#print .pnav,#print .az,#print .search,#print .tplg,#print .tpb{display:none!important}
#print ::placeholder{color:transparent}
#print .pta{border:1px solid var(--line);border-radius:3px;padding:6px 8px;white-space:pre-wrap;line-height:1.6;flex:none}
#print .pta.body{flex:1;border:none}
#print .mg{min-height:0}
#print .wk{min-height:0}
#print h1{font-size:22px}
.btitle{height:30px;border-bottom:2px solid var(--ink);flex:none}
.bdate{display:flex;gap:8px;align-items:flex-end;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:8px 0 10px}
.bdate span{flex:none;width:40mm;border-bottom:1px solid var(--line2);height:16px}
.bbody{flex:1;border:1px solid var(--line2)}
.bt-lined{background:repeating-linear-gradient(to bottom,transparent 0 calc(8mm - 1px),var(--line2) calc(8mm - 1px) 8mm)}
.bt-dot{background:radial-gradient(circle,var(--muted) .25mm,transparent .35mm) 0 0/5mm 5mm}
.bt-grid{background:linear-gradient(var(--line2) 1px,transparent 1px) 0 0/5mm 5mm,linear-gradient(90deg,var(--line2) 1px,transparent 1px) 0 0/5mm 5mm}
.bt-check{background:radial-gradient(circle at 4mm 4.6mm,transparent 1.3mm,var(--muted) 1.35mm,var(--muted) 1.6mm,transparent 1.65mm) 0 0/100% 8mm,repeating-linear-gradient(to bottom,transparent 0 calc(8mm - 1px),var(--line2) calc(8mm - 1px) 8mm)}
.bt-cornell{display:grid;grid-template-columns:30% 1fr;grid-template-rows:1fr 22%}
.bt-cornell div{background:repeating-linear-gradient(to bottom,transparent 0 calc(8mm - 1px),var(--line) calc(8mm - 1px) 8mm)}
.bt-cornell div:first-child{border-right:1px solid var(--line2)}
.bt-cornell div:last-child{grid-column:1/3;border-top:1px solid var(--line2)}
.pcols{columns:2;column-gap:10mm;font-size:11px}
.pc{break-inside:avoid;padding:2.5mm 0;border-bottom:1px solid var(--line)}
.pc .pcn{font-weight:800;font-size:12.5px}
.pc .pl{display:inline-block;width:22mm;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pc .pa{white-space:pre-line;margin-top:1mm}
.pcols .lt{break-after:avoid;margin-top:4mm}
@media print{
  html,body{height:auto;min-width:0;background:#fff;display:block}
  body>*:not(#print){display:none!important}
  #print{display:block!important;position:static!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

function buildPrint(o){
  const[pw,ph]=PAPER[o.paper]||PAPER.A4,two=o.what!=='contacts'&&o.layout==='2';
  const W=two?ph:pw,H=two?pw:ph,m=o.paper==='A5'?8:10,iw=W-2*m,ih=H-2*m;
  $('#pagestyle').textContent=`@page{size:${W}mm ${H}mm;margin:${m}mm}`;
  const P=$('#print');P.innerHTML='';P.classList.add('measure');
  if(o.what==='contacts'){P.innerHTML=`<div class="pin" style="width:${iw}mm">${contactsPrint()}</div>`}
  else{
    let pages=o.what==='blank'?Array.from({length:Math.max(1,Math.min(60,o.n|0||1))},()=>blankPage(o.tpl)):VIEWFN[ui.view]();
    const per=two?2:1;
    for(let i=0;i<pages.length;i+=per){
      const s=document.createElement('div');s.className='sheet';s.style.width=iw+'mm';s.style.height=ih+'mm';
      pages.slice(i,i+per).forEach(h=>{const pp=document.createElement('div');pp.className='ppage';pp.innerHTML=`<div class="pin">${h}</div>`;s.appendChild(pp)});
      if(per===2&&pages.slice(i,i+per).length===1)s.appendChild(Object.assign(document.createElement('div'),{className:'ppage'}));
      P.appendChild(s);
    }
  }
  P.querySelectorAll('textarea').forEach(x=>{const d=document.createElement('div');d.className='pta '+x.className;d.textContent=x.value;d.style.minHeight=(Math.max(1,x.rows||2)*1.6+0.8)+'em';x.replaceWith(d)});
  P.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
  P.querySelectorAll('.ppage').forEach(pp=>{const pin=pp.firstElementChild;if(!pin)return;const need=pin.scrollHeight,have=pp.clientHeight;
    if(need>have+1){const z=have/need;pin.style.transform=`scale(${z})`;pin.style.width=(100/z)+'%';pin.style.minHeight=(100/z)+'%'}});
  P.classList.remove('measure');
}

function run(cmd){
  const now=Date.now();if(cmd===lastCmd&&now-lastT<300)return;lastCmd=cmd;lastT=now;
  closeMenus();

  switch(c){
    case'view':ui.view=arg;if(arg==='contacts'){}break;
    case'theme':ui.theme=arg;render();renderChrome();rebuildMenu();return;
    case'lang':ui.lang=arg;render();renderChrome();rebuildMenu();return;
    case'today':ui.cur=today();if(!['day','week','month','year'].includes(ui.view))ui.view='day';break;
    case'prev':if(!nav(-1))return;break;
    case'next':if(!nav(1))return;break;
    case'goDate':openGoDate();return;
    case'print':openPrint();return;
    case'backup':openBackup(false);return;
    case'restore':openBackup(true);return;
    case'newNote':newNote('lined');return;
    case'newContact':newContact();return;
    case'newProject':newProject();return;
    case'profile':openProfile(!DB.profile);return;
    case'settings':openSettings();return;
    case'find':ui.view='contacts';render();setTimeout(()=>{const q=$('#q');if(q){q.focus();q.select()}},0);return;
    case'zoomIn':ui.zoom=Math.min(1.6,Math.round((ui.zoom+0.1)*10)/10);break;
    case'zoomOut':ui.zoom=Math.max(0.6,Math.round((ui.zoom-0.1)*10)/10);break;
    case'zoomReset':ui.zoom=1;break;
    case'fullscreen':{const w=TAURI&&tauriWin();if(w){w.isFullscreen().then(f=>w.setFullscreen(!f)).catch(()=>{})}else{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}}return}
    case'quit':{save(true);const w=TAURI&&tauriWin();if(w)w.close();return}
    case'shortcuts':openShortcuts();return;
    case'about':openAbout();return;
    case'undo':case'redo':case'cut':case'copy':case'selectAll':try{document.execCommand(c==='selectAll'?'selectAll':c)}catch(e){}return;
    case'paste':try{navigator.clipboard.readText().then(x=>document.execCommand('insertText',false,x)).catch(()=>toast(t('pasteHint')))}catch(e){toast(t('pasteHint'))}return;
    default:return;
  }
  render();
}

async function nativeItems(items){
  const M=TAURI.menu,out=[];
  for(const it of items){
    try{
      if(it.sep)out.push(await M.PredefinedMenuItem.new({item:'Separator'}));
      else if(it.pre)out.push(await M.PredefinedMenuItem.new(it.label?{item:it.pre,text:it.label}:{item:it.pre}));
      else if(it.items)out.push(await M.Submenu.new({text:it.label,items:await nativeItems(it.items)}));
      else if(it.check)out.push(await M.CheckMenuItem.new({text:it.label,checked:!!it.checked,action:()=>run(it.id)}));
      else{
        const o={text:it.label,action:()=>run(it.id)};
        let made=null;
        if(it.acc){try{made=await M.MenuItem.new({...o,accelerator:it.acc})}catch(e){made=null}}
        out.push(made||await M.MenuItem.new(o));
      }
    }catch(e){console.warn('menu item failed',it,e)}
  }
  return out;
}
async function buildNative(){
  const M=TAURI.menu,subs=[];
  for(const s of MENU(true))subs.push(await M.Submenu.new({text:s.label,items:await nativeItems(s.items)}));
  const menu=await M.Menu.new({items:subs});
  await menu.setAsAppMenu();
}

    case'goDateOk':{const g=$('#gd');commitTyped(g);const v=g.dataset.iso;if(/^\d{4}-\d{2}-\d{2}$/.test(v)){ui.cur=v;if(!['day','week','month','year'].includes(ui.view))ui.view='day';closeDlg();render()}return}
    case'copyBk':{const txt=$('#bk').value,fail=()=>{$('#bk').select();$('#bkmsg').textContent=t('pressCopy')};try{navigator.clipboard.writeText(txt).then(()=>toast(t('copied')),fail)}catch(err){fail()}return}
    case'dlBk':{try{const b=new Blob([$('#bk').value],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=`organizer-backup-${today()}.json`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);$('#bkmsg').textContent=t('dlHint')}catch(err){$('#bkmsg').textContent=t('dlNo')}return}
    case'restoreBk':{try{const o=JSON.parse($('#bk').value);if(!o||typeof o!=='object'||!('days' in o||'contacts' in o))throw 0;DB=o;fix();save(true);ui.contact=null;ui.note=null;closeDlg();render();toast(t('restored'))}catch(err){$('#bkmsg').textContent=t('invalid')}return}
    default:return;
  }
  render();
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.matches('input.dt')){if(DP&&DP.el===el)closePicker();return}
  if(el.id==='q'){ui.q=el.value;$('#clist').innerHTML=contactList();return}
  const k=el.dataset.k;if(!k)return;
  set(k,el.type==='checkbox'?el.checked:el.value);save();
  if(el.type==='checkbox'){const row=el.closest('.todo');if(row)row.classList.toggle('done',el.checked)}
  if(k.startsWith('contacts.')&&/\.(first|last|company|emails|phones)/.test(k)&&ui.contact&&DB.contacts[ui.contact]){
    const c=DB.contacts[ui.contact];$('#clist').innerHTML=contactList();$('#cname').textContent=cname(c);$('#cav').textContent=initials(c);$('#ckick').textContent=c.company||t('contact')}
  if(k.startsWith('notes.')&&k.endsWith('.title'))$('#nlist').innerHTML=noteList();
  if(k.startsWith('projects.')&&$('#plist'))$('#plist').innerHTML=projectList();
});
document.addEventListener('change',e=>{
  if(e.target.name==='pw')printFields();
  if(e.target.matches('select.pick')&&e.target.value&&ui.project&&DB.projects[ui.project]){const P=DB.projects[ui.project];(P.people=P.people||[]).push({id:e.target.value,role:''});save();render();return}
  if(e.target.id==='wLang'){const v=collectProfile();ui.lang=e.target.value;render();renderChrome();rebuildMenu();openProfile(true,v);return}
  if(e.target.id==='bkfile'){const f=e.target.files[0];if(!f)return;f.text().then(x=>{$('#bk').value=x;$('#bkmsg').textContent=t('fileLoaded')});e.target.value=''}
});
$('#theme').addEventListener('change',e=>run('theme:'+e.target.value));
$('#lang').addEventListener('change',e=>run('lang:'+e.target.value));
document.addEventListener('keydown',e=>{
  const el=e.target,mod=e.ctrlKey||e.metaKey,k=e.key;
  if(k==='Escape'&&DP){closePicker();return}
  if(el.matches&&el.matches('input.dt')){
    if(k==='Enter'){e.preventDefault();const ok=commitTyped(el);closePicker();if(ok&&el.id==='gd')$('[data-act=goDateOk]').click();return}
    if(k==='ArrowDown'&&!DP){e.preventDefault();openPicker(el);return}
    if(k==='Tab')closePicker();
  }
  if(k==='Escape'){if(dlgOpen())closeDlg();closeMenus();return}
  if(dlgOpen()){if(k==='Enter'&&el.id==='gd'){e.preventDefault();$('[data-act=goDateOk]').click()}return}
  if(k==='Enter'&&el.getAttribute&&el.getAttribute('role')==='button'){el.click();return}
  if(k==='Enter'&&el.matches&&el.matches('.todo input.ln')){e.preventDefault();const b=el.closest('.list')?.querySelector(':scope > .add');if(b)b.click();return}
  let cmd=null;
  if(mod&&!e.altKey){
    const kk=k.toLowerCase();
    if(/^[1-7]$/.test(k))cmd='view:'+VIEWS[+k-1];
    else if(kk==='p')cmd=e.shiftKey?'newProject':'print';
    else if(k===',')cmd='settings';
    else if(kk==='n')cmd=e.shiftKey?'newContact':'newNote';
    else if(kk==='f')cmd='find';
    else if(kk==='t')cmd='today';
    else if(kk==='g')cmd='goDate';
    else if(k==='='||k==='+')cmd='zoomIn';
    else if(k==='-')cmd='zoomOut';
    else if(k==='0')cmd='zoomReset';
    else if(kk==='q'&&NATIVE&&!IS_MAC)cmd='quit';
  }else if(e.altKey&&!mod&&(k==='ArrowLeft'||k==='ArrowRight'))cmd=k==='ArrowLeft'?'prev':'next';
  else if(k==='F11'&&!IS_MAC)cmd='fullscreen';
  if(cmd){e.preventDefault();run(cmd);return}
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)||mod||e.altKey)return;
  if(k==='ArrowLeft')run('prev');
  else if(k==='ArrowRight')run('next');
  else if(k==='t')run('today');
});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{DB=JSON.parse(e.newValue);fix();render()}catch(err){}}});

render();
renderChrome();
if(!DB.profile&&!ui.welcomed){ui.welcomed=true;saveUI();openProfile(true)}
if(TAURI&&TAURI.menu){NATIVE=true;$('#menubar').innerHTML='';menuBusy=buildNative().catch(err=>{console.warn('native menu failed',err);NATIVE=false;renderHtmlMenu()})}
</script>
</body>
</html>
